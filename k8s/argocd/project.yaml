apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: proj18
  namespace: argocd
spec:
  description: ArgoCD project for the proj18 bias-variance stack
  sourceRepos:
    - "*"
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: platform
      server: https://kubernetes.default.svc
    - namespace: mealie
      server: https://kubernetes.default.svc
    - namespace: serving
      server: https://kubernetes.default.svc
    - namespace: data
      server: https://kubernetes.default.svc
    - namespace: training
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
