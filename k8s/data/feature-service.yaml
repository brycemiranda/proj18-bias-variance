apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-service
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feature-service
  template:
    metadata:
      labels:
        app: feature-service
    spec:
      containers:
        - name: feature-service
          image: mahimamariah/mealie-feature-service:latest
          ports:
            - containerPort: 8080
          # Startup probe is generous — corpus loading takes ~30s on first boot
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: POSTGRES_HOST
              value: postgres.platform.svc.cluster.local
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: secretkey
            - name: POSTGRES_DB
              value: mealie
            - name: MINIO_ENDPOINT
              value: "http://minio-service.platform.svc.cluster.local:9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: accesskey
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: secretkey
            - name: MINIO_BUCKET
              value: "mlflow-artifacts"
            - name: DATA_BUCKET
              value: "training-data"
            - name: INFERENCE_API_URL
              value: "http://inference-service.serving.svc.cluster.local:8000"
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: feature-service
  namespace: data
spec:
  type: ClusterIP
  selector:
    app: feature-service
  ports:
    - port: 8080
      targetPort: 8080
