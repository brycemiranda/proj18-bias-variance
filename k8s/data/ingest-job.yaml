apiVersion: batch/v1
kind: Job
metadata:
  name: ingest-run
  namespace: data
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ingest
          image: proj18biasvariance/mealie-ingest:local
          imagePullPolicy: Never
          env:
            - name: BUCKET_NAME
              value: training-data
            - name: S3_ENDPOINT
              value: http://minio-service.platform.svc.cluster.local:9000
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: accesskey
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: secretkey
            - name: KAGGLE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kaggle-secret
                  key: token
                  optional: true
            - name: FORCE_INGEST
              value: "0"
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
