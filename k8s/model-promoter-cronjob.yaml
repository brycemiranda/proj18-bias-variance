  generation: 1
  name: model-promoter
  namespace: mealie-prod
  resourceVersion: "22709"
  uid: 2d1faee8-2411-4ecc-889e-bc9ecf456649
spec:
  concurrencyPolicy: Allow
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata: {}
    spec:
      backoffLimit: 1
      template:
        metadata: {}
        spec:
          containers:
          - args:
            - |
              pip install --no-cache-dir boto3 mlflow >/tmp/pip.log 2>&1
              python - <<'PY'
              import os, sys, json
              from datetime import datetime
              from io import BytesIO
              import boto3
              import mlflow

              endpoint  = os.environ["MINIO_ENDPOINT"]
              access    = os.environ["MINIO_ACCESS_KEY"]
              secret    = os.environ["MINIO_SECRET_KEY"]
              tracking  = os.environ["MLFLOW_TRACKING_URI"]
              model_bucket = "mlflow-artifacts"

              s3 = boto3.client("s3", endpoint_url=endpoint,
                  aws_access_key_id=access, aws_secret_access_key=secret)

              def copy_artifact(src, dst):
                  obj = s3.get_object(Bucket=model_bucket, Key=src)
                  s3.put_object(Bucket=model_bucket, Key=dst, Body=obj["Body"].read())
                  print(f"Copied {src} -> {dst}")

              def artifact_exists(key):
                  try:
                      s3.head_object(Bucket=model_bucket, Key=key)
                      return True
                  except:
                      return False

              mlflow.set_tracking_uri(tracking)
              client = mlflow.tracking.MlflowClient()

              try:
                  exp = client.get_experiment_by_name("nightly-eval")
                  if exp is None:
                      print("No nightly-eval experiment found yet — skipping promotion")
                      sys.exit(0)

                  runs = client.search_runs(
                      experiment_ids=[exp.experiment_id],
                      order_by=["start_time DESC"],
                      max_results=1,
                  )
                  if not runs:
                      print("No eval runs yet — skipping")
                      sys.exit(0)

                  run = runs[0]
                  metrics = run.data.metrics
                  params  = run.data.params

                  inference_ok  = int(metrics.get("inference_status", 0)) == 200
                  tag_vec_ok    = int(metrics.get("tag_vector_exists", 0)) == 1
                  train_rows    = int(metrics.get("train_rows", 0))
                  failed_checks = params.get("failed_checks", "unknown")

                  print(f"Latest eval: inference_ok={inference_ok}, tag_vec_ok={tag_vec_ok}, train_rows={train_rows}, failed={failed_checks}")

                  if not inference_ok:
                      if artifact_exists("production/tag_to_vector.pkl.bak"):
                          copy_artifact("production/tag_to_vector.pkl.bak",
                                        "production/tag_to_vector.pkl")
                          print("ROLLBACK: restored production from backup")
                      else:
                          print("ROLLBACK needed but no backup found")
                      sys.exit(0)

                  staging_ready = (
                      artifact_exists("staging/tag_to_vector.pkl")
                      and tag_vec_ok
                      and train_rows > 0
                      and failed_checks in ("none", "empty_dataset")
                  )
                  if staging_ready:
                      if artifact_exists("canary/tag_to_vector.pkl"):
                          if artifact_exists("production/tag_to_vector.pkl"):
                              copy_artifact("production/tag_to_vector.pkl",
                                            "production/tag_to_vector.pkl.bak")
                          copy_artifact("canary/tag_to_vector.pkl",
                                        "production/tag_to_vector.pkl")
                          print("PROMOTED canary -> production")

                      copy_artifact("staging/tag_to_vector.pkl",
                                    "canary/tag_to_vector.pkl")
                      print("PROMOTED staging -> canary")
                  else:
                      print(f"Staging not ready for promotion: staging_exists={artifact_exists('staging/tag_to_vector.pkl')}, train_rows={train_rows}")

                  print("Promoter run complete")

              except Exception as e:
                  print(f"Promoter error: {e}")
                  raise
              PY
            command:
            - /bin/sh
            - -lc
            envFrom:
            - configMapRef:
                name: shared-env
            image: python:3.11-slim
            imagePullPolicy: IfNotPresent
            name: model-promoter
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 128Mi
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: OnFailure
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
  schedule: 0 */6 * * *
  successfulJobsHistoryLimit: 3
  suspend: false
status: {}
