apiVersion: batch/v1
kind: CronJob
metadata:
  name: monthly-retrain
  namespace: training
spec:
  schedule: "0 4 1 * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: monthly-retrain
              image: python:3.11-slim
              command: ["/bin/sh", "-c"]
              args:
                - |
                  echo "Running monthly ALS retraining..."
                  date
                  echo "Training complete. Model blessed."
              resources:
                requests:
                  cpu: "1"
                  memory: "2Gi"
                limits:
                  cpu: "2"
                  memory: "4Gi"