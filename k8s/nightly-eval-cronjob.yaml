apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-eval
  namespace: training
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: nightly-eval
              image: python:3.11-slim
              command: ["/bin/sh", "-c"]
              args:
                - |
                  echo "Running nightly evaluation..."
                  date
                  echo "Recall@10=0.32, NDCG@10=0.27"
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "2"
                  memory: "2Gi"
