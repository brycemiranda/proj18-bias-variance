apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-bootstrap
  namespace: platform
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: postgres-bootstrap
          image: postgres:15
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
          command:
            - /bin/sh
            - -c
          args:
            - |
              until pg_isready -h postgres.platform.svc.cluster.local -U "$POSTGRES_USER" -d postgres; do
                echo "Waiting for PostgreSQL..."
                sleep 5
              done
              export PGPASSWORD="$POSTGRES_PASSWORD"
              psql -U "$POSTGRES_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'mlflow'" | grep -q 1 \
                || psql -U "$POSTGRES_USER" -d postgres -c "CREATE DATABASE mlflow"
              psql -U "$POSTGRES_USER" -d mealie <<'SQL'
              CREATE TABLE IF NOT EXISTS mealie_events (
                  id           SERIAL PRIMARY KEY,
                  user_id      VARCHAR(50)  NOT NULL,
                  recipe_id    VARCHAR(50)  NOT NULL,
                  event_type   VARCHAR(20)  NOT NULL,
                  rating       INTEGER,
                  weight       FLOAT        NOT NULL,
                  timestamp    TIMESTAMP    DEFAULT CURRENT_TIMESTAMP
              );

              CREATE TABLE IF NOT EXISTS tag_vectors (
                  tag          VARCHAR(200) PRIMARY KEY,
                  vector       JSONB        NOT NULL,
                  updated_at   TIMESTAMP    DEFAULT CURRENT_TIMESTAMP
              );

              CREATE TABLE IF NOT EXISTS user_vectors (
                  user_id      VARCHAR(50)  PRIMARY KEY,
                  vector       JSONB        NOT NULL,
                  updated_at   TIMESTAMP    DEFAULT CURRENT_TIMESTAMP
              );

              CREATE INDEX IF NOT EXISTS idx_events_user_id   ON mealie_events(user_id);
              CREATE INDEX IF NOT EXISTS idx_events_timestamp  ON mealie_events(timestamp);
              SQL
