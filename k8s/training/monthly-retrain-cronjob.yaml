apiVersion: batch/v1
kind: CronJob
metadata:
  name: monthly-retrain
  namespace: training
spec:
  schedule: "0 4 1 * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: monthly-retrain
              image: proj18biasvariance/mealie-als-training:local
              imagePullPolicy: Never
              args:
                - python
                - train.py
                - --data-dir
                - /data
              env:
                - name: MLFLOW_TRACKING_URI
                  value: http://mlflow-service.platform.svc.cluster.local:5000
                - name: MLFLOW_S3_ENDPOINT_URL
                  value: http://minio-service.platform.svc.cluster.local:9000
                - name: MINIO_ENDPOINT
                  value: http://minio-service.platform.svc.cluster.local:9000
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-secret
                      key: accesskey
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-secret
                      key: secretkey
                - name: MINIO_BUCKET
                  value: mlflow-artifacts
                - name: POSTGRES_HOST
                  value: postgres.platform.svc.cluster.local
                - name: POSTGRES_DB
                  value: mealie
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: username
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: password
                - name: NDCG_THRESHOLD
                  value: "0.0001"
                - name: CHAMELEON_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: artifact-restore-secret
                      key: CHAMELEON_ENDPOINT
                      optional: true
                - name: CHAMELEON_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: artifact-restore-secret
                      key: CHAMELEON_ACCESS_KEY
                      optional: true
                - name: CHAMELEON_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: artifact-restore-secret
                      key: CHAMELEON_SECRET_KEY
                      optional: true
                - name: CHAMELEON_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: artifact-restore-secret
                      key: CHAMELEON_BUCKET
                      optional: true
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: artifact-restore-secret
                      key: HF_TOKEN
                      optional: true
                - name: HF_REPO
                  valueFrom:
                    secretKeyRef:
                      name: artifact-restore-secret
                      key: HF_REPO
                      optional: true
              resources:
                requests:
                  cpu: "1000m"
                  memory: "2Gi"
                limits:
                  cpu: "2000m"
                  memory: "4Gi"
